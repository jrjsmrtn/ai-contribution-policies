# Quality gates for the ai-contribution-policies bundle.
#
# CONFORMANCE comes from `okf` (github.com/okfcli/okf), v0.4.0 or newer — ADR-0010. The floor is
# ASSERTED below, not just stated: this line read `pinned at v0.2.1` until 2026-09-04 while the
# installed tool was 0.4.0 and run-gates.sh claimed v0.3.0. Three numbers, no comparison. It checks
# §5.1 footnote->sources[].id, §5.2 ISO datetimes, §5.5 stale_after expiry, §8 index.md
# frontmatter, §9 log.md date headings, and link resolution. On first run against this bundle it
# found 6 errors and 37 malformed timestamps that the previous local gates never looked at.
#
#   install: go install github.com/okfcli/okf/cmd/okf@v0.4.0
#
# The LOCAL gates in the `supplychain-workspace` meta-project now cover only what okf does not:
#   - check-okf.py   two footnote-DEFINITION faults (referenced-but-undefined, defined-but-unused)
#   - check-dates.py ISO dates across the whole repository, including CLAUDE.md and CHANGELOG.md,
#                    which are not part of the bundle and which okf therefore never sees
# `check-doc-links.py` covers `knowledge/` as well as this repository's own prose. It was retired
# for the bundle on the stated grounds that `okf resolves bundle links`. MEASURED 2026-09-04 in
# the landscape sibling: it does not. A planted missing target left `okf validate` and `okf lint`
# both reporting `valid: true` at exit 0 -- so bundle-relative links were checked by nothing. The
# divergence argument was sound; the premise it rested on was untested. Re-wiring it needed a fix
# in the shared checker, whose reference-style guard matched OKF FOOTNOTE definitions (`[^id]:`).
#
# Three limits to know about:
#
# check-bundle-index.py closes the gap that `index.md` is DERIVED and nothing regenerated it.
# `okf index` generates those files from concept frontmatter; no gate compared them against it, so
# on 2026-08-29 the category index still described Debian's ballot as "six competing proposals in
# discussion" fifteen days after the record said eight, with CTAN and TeX Live in a stale bullet
# list beside the table. It regenerates into a temp copy and diffs -- it never writes to the tree.
#
#   - okf is a hard requirement. If it is absent the hook FAILS rather than skipping — a gate that
#     quietly does nothing is the failure mode this arrangement risks, and silence makes it
#     dangerous. A publishable bundle passing an unrun gate is worse than a blocked commit.
#   - The local gates depend on the meta-project being checked out beside this repository. Same
#     rule: absent means fail, not skip.
#   - A hook only fires on commit, so it cannot catch a `stale_after` that expires while nobody is
#     committing. That is what the weekly scheduled run is for.
#
# Install with: lefthook install

pre-commit:
  parallel: true
  commands:
    # Relative links, anchors, and a sweep for filenames git says no longer exist.
    #
    # Run HERE, against THIS repository's history -- not from the workspace. The dead-name set is
    # repo-scoped, and sweeping a sibling with the workspace's set reports live files as dead by
    # construction: `index.md` died there many times over when ADR-0005 extracted the LANDSCAPE
    # corpus, and this repository has five live ones.
    #
    # This comment used to say those names died `when ADR-0005 extracted this corpus`, and to cite
    # `purl.md` as the example. Both were inherited verbatim with this config from the landscape
    # sibling, where they are true. This bundle was never in the workspace corpus and `purl.md`
    # has never existed here -- checked against the history, not assumed. Corrected 2026-09-04.
    #
    # This repository's OWN dead-name set is currently empty: nothing has been renamed or deleted
    # in its history. The sweep therefore costs nothing today and starts earning its place the
    # first time something is.
    doc-links:
      run: python3 ../../workspace/scripts/check-doc-links.py knowledge README.md CLAUDE.md CHANGELOG.md

    # A changelog has a SHAPE, and that shape is checkable even though its prose is not.
    # On 2026-08-29 [Unreleased] was found carrying two `### Added` blocks, two `### Changed`
    # blocks and a stale `### Notes` entry -- committed twice and pushed to two remotes. okf never
    # sees this file, and doc-links and check-dates both passed throughout, because a duplicated
    # heading is neither a broken link nor a malformed date.
    changelog:
      run: python3 ../../workspace/scripts/check-changelog.py CHANGELOG.md

    gitleaks:
      run: gitleaks protect --staged --verbose
    reuse:
      run: reuse lint
    okf-conformance:
      run: |
        OKF_MIN=0.4.0
        if ! command -v okf >/dev/null 2>&1; then
          echo "okf not found on PATH — OKF conformance is UNCHECKED." >&2
          echo "  install: go install github.com/okfcli/okf/cmd/okf@v$OKF_MIN" >&2
          exit 1
        fi
        HAVE=$(okf version 2>/dev/null | sed -n 's/.*"version": *"\([^"]*\)".*/\1/p')
        if [ -z "$HAVE" ]; then
          echo "could not read okf's version — refusing to assume it is new enough." >&2
          exit 1
        fi
        if [ "$(printf '%s\n%s\n' "$HAVE" "$OKF_MIN" | sort -t. -k1,1n -k2,2n -k3,3n | head -1)" != "$OKF_MIN" ]; then
          echo "okf $HAVE is older than the required $OKF_MIN." >&2
          echo "  install: go install github.com/okfcli/okf/cmd/okf@v$OKF_MIN" >&2
          exit 1
        fi
        R=../workspace/scripts/okf-report.py
        out=$(okf validate knowledge); rc1=$?
        printf '%s' "$out" | python3 "$R"
        out=$(okf lint knowledge); rc2=$?
        printf '%s' "$out" | python3 "$R"
        [ "$rc1" -eq 0 ] && [ "$rc2" -eq 0 ]
    bundle-gates:
      run: |
        if ! command -v okf-gate >/dev/null 2>&1; then
          echo "bundle-gates: okf-gate not found on PATH — footnote faults are UNCHECKED." >&2
          echo "  It promotes okf's footnote WARNINGS to failures; okf alone exits 0 on them." >&2
          echo "  Install it from the okf-gate repository (see CLAUDE.local.md for the remote)." >&2
          exit 1
        fi
        G=../workspace/scripts        # this workspace
        S=../../workspace/scripts     # the outer meta-project: shared, format-generic checkers
        if [ ! -d "$G" ]; then
          echo "bundle-gates: no meta-project at $G" >&2
          echo "The gates live in supplychain-workspace, expected beside this repository." >&2
          echo "Without it, repo-level ISO dates are UNCHECKED (footnotes now come from okf-gate)." >&2
          exit 1
        fi
        okf-gate knowledge &&
        python3 "$G/check-dates.py" . &&
        python3 "$S/check-bundle-types.py" knowledge &&
        python3 "$S/check-bundle-index.py" knowledge
